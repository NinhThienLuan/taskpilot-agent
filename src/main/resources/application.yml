spring:
  application:
    name: taskpilot-agent
  profiles:
    default: ollama
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskpilot}
    username: ${DB_USER:taskpilot}
    password: ${DB_PASSWORD:taskpilot}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:taskpilot}
    password: ${RABBITMQ_PASSWORD:taskpilot}
  ai:
    model:
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

server:
  port: ${SERVER_PORT:8080}

taskpilot:
  agent:
    max-iterations: 15
    command-timeout-seconds: 90
    max-read-lines: 200
    max-grep-matches: 40
    max-command-output-lines: 90
  sandbox:
    mode: local # Switch to "docker" to run commands inside isolated container
    image: taskpilot-sandbox:java21
    cpus: "2.0"
    memory: "2g"
    pids-limit: 256
    network-mode: bridge
    maven-cache-volume: ""
  queue:
    mode: rabbitmq # Switch to "in-memory" for local testing without RabbitMQ
    name: taskpilot.jobs.queue
  run:
    enabled: false
    repo: ""
    task: ""
    extra-prompt: ""
    test-command: "mvn test"
