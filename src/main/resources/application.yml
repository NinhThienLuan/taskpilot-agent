spring:
  application:
    name: taskpilot-agent
  profiles:
    default: ollama
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskpilot}
    username: ${DB_USER:taskpilot}
    password: ${DB_PASSWORD:taskpilot}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:taskpilot}
    password: ${RABBITMQ_PASSWORD:taskpilot}
  ai:
    model:
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

server:
  port: ${SERVER_PORT:8080}

taskpilot:
  agent:
    max-iterations: 15
    command-timeout-seconds: 90
    max-read-lines: 200
    max-grep-matches: 40
    max-command-output-lines: 90
    max-total-tokens: 500000
    max-consecutive-duplicate-tool-calls: 3
  sandbox:
    mode: local # Switch to "docker" to run commands inside isolated container
    image: taskpilot-sandbox:java21
    cpus: "2.0"
    memory: "2g"
    pids-limit: 256
    network-mode: bridge
    maven-cache-volume: ""
  queue:
    mode: rabbitmq # Switch to "in-memory" for local testing without RabbitMQ
    name: taskpilot.jobs.queue
  integrations:
    github:
      enabled: ${GITHUB_INTEGRATION_ENABLED:false}
      api-base-url: https://api.github.com
      token: ${GITHUB_TOKEN:}
      owner: ${GITHUB_OWNER:}
      repo: ${GITHUB_REPO:}
      base-branch: ${GITHUB_BASE_BRANCH:main}
      draft-pr: true
    jira:
      enabled: ${JIRA_INTEGRATION_ENABLED:false}
      base-url: ${JIRA_BASE_URL:}
      email: ${JIRA_EMAIL:}
      api-token: ${JIRA_API_TOKEN:}
      transition-status: ${JIRA_TRANSITION_STATUS:In Review}
  eval:
    enabled: false
    cases-file: eval/cases/cases.json
    report-dir: eval-reports
    case-id: ""
  run:
    enabled: false
    repo: ""
    task: ""
    extra-prompt: ""
    test-command: "mvn test"
