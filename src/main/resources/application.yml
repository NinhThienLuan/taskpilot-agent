spring:
  application:
    name: taskpilot-agent
  main:
    web-application-type: none
  ai:
    model:
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

taskpilot:
  agent:
    max-iterations: 15
    command-timeout-seconds: 90
    max-read-lines: 200
    max-grep-matches: 40
    max-command-output-lines: 90
  sandbox:
    mode: local # Switch to "docker" to run commands inside isolated container
    image: taskpilot-sandbox:java21
    cpus: "2.0"
    memory: "2g"
    pids-limit: 256
    network-mode: bridge
    maven-cache-volume: ""
  run:
    enabled: false
    repo: ""
    task: ""
    extra-prompt: ""
    test-command: "mvn test"
