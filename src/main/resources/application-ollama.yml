# Ollama profile for local small models (e.g., qwen2.5-coder:7b, qwen3:8b, llama3.2)
# Requires local Ollama running at http://localhost:11434
spring:
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: 0.1
          num-ctx: 16384

taskpilot:
  agent:
    max-iterations: 12
    max-read-lines: 150
    max-command-output-lines: 70
