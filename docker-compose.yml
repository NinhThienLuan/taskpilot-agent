services:
  postgres:
    image: postgres:16-alpine
    container_name: taskpilot-postgres
    environment:
      POSTGRES_DB: taskpilot
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot
    ports:
      - "5432:5432"
    volumes:
      - taskpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: taskpilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: taskpilot
      RABBITMQ_DEFAULT_PASS: taskpilot
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskpilot_pgdata:
